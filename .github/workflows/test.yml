name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─── npm ────────────────────────────────────────────────────────────────────
  test-npm:
    name: npm wrapper tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.13'

      - name: Install workspace dependencies
        run: bun install

      - name: Download gitleaks binaries
        run: bun scripts/build-npm-pkgs.mjs
        # Downloads all 9 platform binaries; tests only exercise the host binary.

      - name: Run npm tests
        working-directory: packages/npm/gitleaks
        run: bun test tests/

  # ─── Python ─────────────────────────────────────────────────────────────────
  test-python:
    name: Python wrapper tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11', '3.12']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: '0.11.11'
          python-version: ${{ matrix.python }}

      - name: Install dev dependencies
        working-directory: packages/python/gitleaks
        run: uv sync --group dev

      - name: Run pytest
        working-directory: packages/python/gitleaks
        run: uv run pytest tests/ -v
        # The downloader fetches the real binary on first run and caches it.
        # No mocking — tests hit the actual gitleaks binary.
