[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nogoo9-gitleaks"
version = "8.30.1-post.3"
description = "Python wrapper for gitleaks — find secrets in git repos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["gitleaks", "secrets", "security", "git", "leak", "detection"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
gitleaks = "nogoo9_gitleaks._cli:main"

[project.urls]
Homepage = "https://github.com/nogoo9/gitleaks"
Repository = "https://github.com/nogoo9/gitleaks"
"Bug Tracker" = "https://github.com/nogoo9/gitleaks/issues"
Changelog = "https://github.com/nogoo9/gitleaks/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nogoo9_gitleaks"]
artifacts = ["src/nogoo9_gitleaks/bin/*"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/", "hatch_build.py", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
